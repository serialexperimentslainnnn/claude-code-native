complexity:
  LargeClass:
    allowedLines: 599
  LongMethod:
    allowedLines: 59
  LongParameterList:
    ignoreDefaultParameters: true
  NestedBlockDepth:
    allowedDepth: 3
  TooManyFunctions:
    allowedFunctionsPerFile: 39
    allowedFunctionsPerClass: 19
    allowedFunctionsPerInterface: 10
    allowedFunctionsPerObject: 39
    allowedFunctionsPerEnum: 10
    ignorePrivate: true

potential-bugs:
  IgnoredReturnValue:
    returnValueTypes:
      - 'kotlin.sequences.Sequence'
      - 'kotlinx.coroutines.flow.*Flow'
      - 'java.util.stream.*Stream'

style:
  LoopWithTooManyJumpStatements:
    maxJumpCount: 2
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts', '**/frontend/theme/ChatTheme.kt', '**/frontend/theme/JcefTheme.kt']
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '6'
      - '8'
      - '10'
      - '12'
      - '16'
      - '100'
      - '1000'
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
  MaxLineLength:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    maxLineLength: 140
  ReturnCount:
    max: 6
    excludeGuardClauses: true
  UnusedPrivateProperty:
    allowedNames: '_|ignored|expected|serialVersionUID'
  UnusedVariable:
    allowedNames: '_|ignored|expected|serialVersionUID'
